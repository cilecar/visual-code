[package]
name = "nodus"
version = "0.1.0"
description = "Nodus — визуальное программирование блоками-нодами"
authors = ["Nodus contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "nodus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
